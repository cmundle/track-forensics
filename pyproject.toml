[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "track-forensics"
version = "0.1.0"
description = "Local-only audio forensics CLI: Demucs stem separation + feature analysis, JSON out, Strudel-friendly hints."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "Christopher Mundle" }]

dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "numpy>=1.26,<2.0",
    # Base, not an extra: audio_io resamples every input to exactly 44.1 kHz and
    # needs scipy's polyphase filter to do it without wrecking the high band.
    # Installing the essentia extra without the librosa one would otherwise leave
    # no band-limited resampler at all.
    "scipy>=1.11",
    "soundfile>=0.12",
    "demucs>=4.0",
    "torch>=2.2",
]

[project.optional-dependencies]
# Essentia is the preferred analyzer but is the hardest install on macOS.
# Install this extra first; if it fails, use the `librosa` extra as fallback.
essentia = ["essentia>=2.1b6.dev1110"]
# pyloudnorm supplies the ITU-R BS.1770 meter librosa does not have.
# scipy is deliberately absent here — it is a base dependency (see above).
librosa = ["librosa>=0.10", "pyloudnorm>=0.1.1"]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
track-forensics = "audio_pipeline.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/audio_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]


[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Slow tests are deselected by default; run them with `pytest -m slow`.
addopts = "-m 'not slow'"
markers = [
    "slow: loads a real model or processes real audio (Demucs end-to-end runs)",
]
